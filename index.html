<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unbanned WhatsApp v3.5 – Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:       #00A884;
      --green-dark:  #008069;
      --green-hover: #006B5A;
      --bg:          #F0F2F5;
      --card:        #FFFFFF;
      --text:        #1A1A1A;
      --text-mid:    #3B3B3B;
      --text-soft:   #8A8A8A;
      --border:      #E9EDF0;
      --shadow:      0 8px 30px rgba(0,0,0,0.05);
      --radius:      16px;
      --transition:  all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html, body {
      height: 100%;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -khtml-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;

            -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    img {
      -webkit-user-drag: none;
      user-drag: none;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      background: var(--green);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .topbar-icon {
      width: 34px; height: 34px;
      background: #fff;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .topbar-icon i { color: var(--green-dark); font-size: 18px; }
    .topbar-name {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.2px;
    }
    .topbar-badge {
      font-size: 10px;
      font-weight: 600;
      background: rgba(255,255,255,0.22);
      color: #fff;
      padding: 2px 7px;
      border-radius: 20px;
      margin-left: 2px;
    }

    .main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 420px;
      overflow: hidden;
      transition: var(--transition);
    }

    .card-header {
      background: linear-gradient(135deg, var(--green) 0%, var(--green-dark) 100%);
      padding: 36px 32px 32px;
      text-align: center;
      position: relative;
    }
    .logo-wrap {
      width: 72px; height: 72px;
      background: rgba(255,255,255,0.15);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
      backdrop-filter: blur(8px);
      border: 2px solid rgba(255,255,255,0.25);
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.04); }
      100% { transform: scale(1); }
    }
    .logo-wrap i { font-size: 36px; color: #fff; }
    .card-title {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }
    .card-sub {
      font-size: 13px;
      color: rgba(255,255,255,0.85);
    }

    .card-body {
      padding: 32px;
    }

    /* Modern Sliding Tab Switch */
    .tab-switch {
      display: flex;
      background: var(--bg);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 24px;
      position: relative;
      z-index: 1;
    }
    .tab-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 10px 0;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-soft);
      cursor: pointer;
      transition: var(--transition);
      font-family: inherit;
      position: relative;
      z-index: 2;
    }
    .tab-btn.active {
      color: var(--green-dark);
    }
    .tab-indicator {
      position: absolute;
      top: 4px;
      left: 4px;
      bottom: 4px;
      width: calc(50% - 4px);
      background: var(--card);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: var(--transition);
      z-index: 1;
    }
    .tab-btn i { margin-right: 6px; font-size: 13px; }

    /* Form Container dengan Smooth Height/Fade */
    .form-container {
      position: relative;
    }
    .form-pane {
      display: none;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .form-pane.active {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    .field { margin-bottom: 18px; position: relative; }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-mid);
      margin-bottom: 6px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-wrap i.lead {
      position: absolute;
      left: 14px;
      color: var(--text-soft);
      font-size: 14px;
      transition: var(--transition);
    }
    .input-wrap input {
      width: 100%;
      height: 48px;
      padding: 0 42px 0 40px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      background: var(--bg);
      outline: none;
      transition: var(--transition);
    }
    .input-wrap input:focus {
      border-color: var(--green);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(0,168,132,0.1);
    }
    .input-wrap input:focus ~ i.lead {
      color: var(--green);
    }
    .caps-warning {
      position: absolute;
      right: 42px;
      color: #FFA000;
      font-size: 12px;
      display: none;
      pointer-events: none;
    }
    .eye-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-soft);
      font-size: 14px;
      padding: 6px;
      transition: color 0.2s;
    }
    .eye-btn:hover { color: var(--green-dark); }

    .extras {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .check-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-mid);
      cursor: pointer;
    }
    .check-label input[type="checkbox"] {
      width: 16px; height: 16px;
      accent-color: var(--green-dark);
      cursor: pointer;
    }
    .forgot {
      font-size: 13px;
      color: var(--green-dark);
      text-decoration: none;
      font-weight: 600;
    }
    .forgot:hover { text-decoration: underline; }

    .btn-submit {
      width: 100%;
      height: 48px;
      background: var(--green-dark);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: var(--transition);
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-submit:hover {
      background: var(--green-hover);
      box-shadow: 0 8px 20px rgba(0,104,88,0.2);
    }
    .btn-submit:active { transform: scale(0.98); }

    .admin-note {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #FFF9E6;
      border: 1px solid #FFE0B2;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #B78103;
    }
    .admin-note i { color: #FFB300; font-size: 15px; }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: var(--text-soft);
    }

    #toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1A1A1A;
      color: #fff;
      padding: 12px 24px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      opacity: 0;
      transition: var(--transition);
      pointer-events: none;
      z-index: 999;
      display: flex; align-items: center; gap: 10px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    #toast.error i { color: #FF5252; }
    #toast.success i { color: #69F0AE; }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 0 32px;
    }
    .card-footer-text {
      padding: 20px 32px;
      text-align: center;
      font-size: 12px;
      color: var(--text-soft);
    }

    @media (max-width: 480px) {
      .card-body { padding: 24px 20px; }
      .card-header { padding: 30px 20px 26px; }
      .divider { margin: 0 20px; }
      .card-footer-text { padding: 16px 20px; }
    }
  </style>
</head>
<body>

<div class="page">

  <nav class="topbar">
    <div class="topbar-icon"><i class="fab fa-whatsapp"></i></div>
    <span class="topbar-name">Unbanned WhatsApp</span>
    <span class="topbar-badge">v3.5</span>
  </nav>

  <main class="main">
    <div class="card">

      <div class="card-header">
        <div class="logo-wrap"><i class="fab fa-whatsapp"></i></div>
        <div class="card-title">Unbanned WhatsApp v3.5</div>
        <div class="card-sub">Pulihkan kembali akun WhatsApp kamu dengan cepat</div>
      </div>

      <div class="card-body">

        <div class="tab-switch">
          <div class="tab-indicator" id="indicator"></div>
          <button class="tab-btn active" id="tab-member" onclick="switchTab('member')">
            <i class="fas fa-user"></i>Member
          </button>
          <button class="tab-btn" id="tab-admin" onclick="switchTab('admin')">
            <i class="fas fa-shield-halved"></i>Admin
          </button>
        </div>

        <div class="form-container">
          <div class="form-pane active" id="pane-member">
            <div class="field">
              <label>Username</label>
              <div class="input-wrap">
                <i class="fas fa-at lead"></i>
                <input type="text" id="m-user" placeholder="Username" autocomplete="username" />
              </div>
            </div>
            <div class="field">
              <label>Password</label>
              <div class="input-wrap">
                <i class="fas fa-lock lead"></i>
                <input type="password" id="m-pass" placeholder="Masukkan password" autocomplete="current-password" onkeyup="checkCaps(event)" />
                <i class="fas fa-arrow-up-z-a caps-warning" title="Caps Lock Aktif"></i>
                <button class="eye-btn" onclick="toggleEye('m-pass', this)" tabindex="-1" type="button">
                  <i class="fas fa-eye"></i>
                </button>
              </div>
            </div>
            <div class="extras">
              <label class="check-label">
                <input type="checkbox" /> Ingat saya
              </label>
              <a href="#" class="forgot">Lupa password?</a>
            </div>
            <button class="btn-submit" onclick="doLogin('member')">
              <i class="fas fa-right-to-bracket"></i> Masuk Sekarang
            </button>
          </div>

          <div class="form-pane" id="pane-admin">
            <div class="admin-note">
              <i class="fas fa-triangle-exclamation"></i>
              Akses terbatas khusus untuk admin Zax.
            </div>
            <div class="field">
              <label>ID Administrator</label>
              <div class="input-wrap">
                <i class="fas fa-user-shield lead"></i>
                <input type="text" id="a-user" placeholder="Username" autocomplete="username" />
              </div>
            </div>
            <div class="field">
              <label>Kunci Keamanan</label>
              <div class="input-wrap">
                <i class="fas fa-lock lead"></i>
                <input type="password" id="a-pass" placeholder="Masukkan password" autocomplete="current-password" onkeyup="checkCaps(event)" />
                <i class="fas fa-arrow-up-z-a caps-warning" title="Caps Lock Aktif"></i>
                <button class="eye-btn" onclick="toggleEye('a-pass', this)" tabindex="-1" type="button">
                  <i class="fas fa-eye"></i>
                </button>
              </div>
            </div>
            <div class="extras">
              <label class="check-label">
                <input type="checkbox" /> Ingat sesi ini
              </label>
              <a href="#" class="forgot">Bantuan masuk?</a>
            </div>
            <button class="btn-submit" onclick="doLogin('admin')">
              <i class="fas fa-shield-halved"></i> Otorisasi Admin
            </button>
          </div>
        </div>

      </div>

      <div class="divider"></div>
      <div class="card-footer-text">
        Dengan melanjutkan, kamu menyetujui seluruh ketentuan layanan kami.
      </div>

    </div>
  </main>

  <footer>© 2026 Unbanned WhatsApp v3.5. Hak Cipta Dilindungi.</footer>
</div>

<div id="toast"><i class="fas fa-circle-info"></i><span id="toast-msg">–</span></div>

<script>
  const USERS = {
    member: [
      { username: 'squad',  password: 'unbanned123' },
      { username: 'heal',   password: 'unbanned123' },
      { username: 'nexus',  password: 'unbanned123' },
    ],
    admin: [
      { username: 'admin', password: 'adminunbanned' },
    ]
  };

  // Modern Tab Switcher dengan Animasi Sliding Indicator
  function switchTab(role) {
    const isMember = role === 'member';
    const indicator = document.getElementById('indicator');
    
    indicator.style.left = isMember ? '4px' : 'calc(50% + 0px)';

    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById(isMember ? 'tab-member' : 'tab-admin').classList.add('active');

    const paneMember = document.getElementById('pane-member');
    const paneAdmin = document.getElementById('pane-admin');

    if (isMember) {
      paneAdmin.classList.remove('active');
      setTimeout(() => { paneAdmin.style.display = 'none'; paneMember.style.display = 'block'; setTimeout(() => paneMember.classList.add('active'), 50); }, 200);
    } else {
      paneMember.classList.remove('active');
      setTimeout(() => { paneMember.style.display = 'none'; paneAdmin.style.display = 'block'; setTimeout(() => paneAdmin.classList.add('active'), 50); }, 200);
    }
  }

  function toggleEye(inputId, btn) {
    const inp = document.getElementById(inputId);
    const isPass = inp.type === 'password';
    inp.type = isPass ? 'text' : 'password';
    btn.querySelector('i').className = isPass ? 'fas fa-eye-slash' : 'fas fa-eye';
  }

  // Deteksi Caps Lock Otomatis
  function checkCaps(event) {
    const capsWarning = event.target.parentElement.querySelector('.caps-warning');
    if (event.getModifierState && event.getModifierState('CapsLock')) {
      capsWarning.style.display = 'block';
    } else {
      capsWarning.style.display = 'none';
    }
  }

  function doLogin(role) {
    const user = document.getElementById(role === 'member' ? 'm-user' : 'a-user').value.trim().toLowerCase();
    const pass = document.getElementById(role === 'member' ? 'm-pass' : 'a-pass').value;

    if (!user || !pass) {
      showToast('Form tidak boleh ada yang kosong.', 'error');
      return;
    }

    const match = USERS[role].find(u => u.username === user && u.password === pass);
    if (!match) {
      showToast('Kredensial akun tidak ditemukan.', 'error');
      return;
    }

    localStorage.setItem('uw_user', user);
    localStorage.setItem('uw_role', role);
    localStorage.setItem('uw_credit', role === 'admin' ? 999999 : 1000);

    showToast('Akses dikonfirmasi! Mengalihkan...', 'success');
    setTimeout(() => { window.location.href = 'home.html'; }, 1100);
  }

  let toastTimer;
  function showToast(msg, type = 'info') {
    const t = document.getElementById('toast');
    const icon = t.querySelector('i');
    document.getElementById('toast-msg').textContent = msg;
    t.className = type;
    icon.className = type === 'error' ? 'fas fa-circle-xmark' : type === 'success' ? 'fas fa-circle-check' : 'fas fa-circle-info';
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
  }

  // Event Listener Enter Key yang Difilter dengan Benar
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const active = document.getElementById('pane-member').style.display !== 'none' ? 'member' : 'admin';
      doLogin(active);
    }
  });

  if (localStorage.getItem('uw_user')) {
    window.location.href = 'home.html';
  }

  // Keamanan Konten Sisi Klien
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && ['c', 'u', 's', 'p'].includes(e.key.toLowerCase())) {
      e.preventDefault();
    }
  });
</script>

</body>
</html>
